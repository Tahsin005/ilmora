<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#09281e" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="50%" stop-color="rgba(16, 185, 129, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.1)" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)" />

  <!-- Glass Card Background -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5" />

  <!-- Arabic Calligraphy 'إ' for Ilmora -->
  <text x="32" y="44" font-family="'Amiri', 'Noto Sans Arabic', 'DejaVu Sans', serif" font-size="34" font-weight="bold" fill="#34d399" text-anchor="middle" filter="drop-shadow(0 0 6px rgba(16,185,129,0.5))">
    إ
  </text>
</svg>